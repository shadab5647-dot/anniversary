<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Anniversary Second Anniverasy Dear Wifey ❤️</title>

<meta property="og:title" content="❤️ A Special Anniversary Surprise For Dear Wifey ❤️">
<meta property="og:description" content="A Love Letter From Shadab ❤️">
<meta property="og:image" content="cover.jpg">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
overflow:hidden;
height:100vh;
background:#000;
color:white;
}

#intro,
#story{
height:100vh;
width:100vw;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
position:relative;
}

#intro{
background:linear-gradient(135deg,#ff4d6d,#4a044e);
}

.envelope{
font-size:110px;
animation:float 2.5s infinite ease-in-out;
}

@keyframes float{
50%{
transform:translateY(-15px);
}
}

.openBtn{
margin-top:25px;
padding:15px 35px;
font-size:18px;
border:none;
border-radius:40px;
background:white;
color:#e91e63;
cursor:pointer;
font-weight:bold;
}

#story{
display:none;
background-size:cover;
background-position:center;
transition:background-image 1s ease-in-out;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.55);
}

.content{
position:relative;
z-index:5;
padding:20px;
max-width:90%;
}

h1{
font-size:36px;
margin-bottom:15px;
}

#message{
font-size:22px;
line-height:1.6;
min-height:140px;
}

.signature{
margin-top:20px;
font-size:22px;
font-weight:bold;
}

.heart{
position:absolute;
color:#ff4d6d;
pointer-events:none;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh);
opacity:0;
}
}

.finalScreen{
position:absolute;
inset:0;
display:none;
background:rgba(0,0,0,.85);
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
z-index:100;
}

.finalScreen h1{
font-size:42px;
margin-bottom:20px;
}

.finalScreen p{
font-size:24px;
line-height:1.8;
}

@media(max-width:768px){

h1{
font-size:30px;
}

#message{
font-size:20px;
}

.finalScreen h1{
font-size:30px;
}

.finalScreen p{
font-size:20px;
}

}
</style>
</head>

<body>

<audio id="music">
<source src="song.mp3" type="audio/mpeg">
</audio>

<div id="intro">

<div class="envelope">💌</div>

<h1>Dear Wifey ❤️</h1>

<p>A Special Anniversary Letter From Shadab</p>

<button class="openBtn" onclick="startStory()">
Open My Heart ❤️
</button>

</div>

<div id="story">

<div class="overlay"></div>

<div class="content">

<h1>Happy Anniversary ❤️</h1>

<div id="message">
My Dear Wifey ❤️
</div>

<div class="signature">
Mohd. Shadab ❤️
</div>

</div>

<div class="finalScreen" id="finalScreen">

<h1>❤️ Happy Anniversary ❤️</h1>

<p>

Dear Wifey ❤️

<br><br>

You Are My Today,

<br>

My Tomorrow,

<br>

And My Forever.

<br><br>

Forever Yours,

<br><br>

Mohd. Shadab ❤️

</p>

</div>

</div>

<script>

const photos = [
'cover.jpg',
'photo1.jpg',
'photo2.jpg',
'photo3.jpg',
'photo4.jpg',
'photo5.jpg',
'photo6.jpg',
'photo7.jpg',
'photo8.jpg',
'photo9.jpg',
'photo10.jpg',
'photo11.jpg',
'photo12.jpg',
'photo13.jpg',
'photo14.jpg'
];

const messages = [

"💖 My Dear Wifey ❤️",

"Every beautiful memory we have shared has become a treasure in my heart.",

"You are not just my wife.",

"You are my best friend, my strength and my peace.",

"Through every smile and every challenge, you have made my world beautiful.",

"Thank you for every memory, every prayer and every dream we have shared.",

"If I had the chance to choose again...",

"I would still choose you ❤️",

"In every lifetime ❤️",

"In every universe ❤️",

"Every single time ❤️",

"Happy Anniversary My Love ❤️"

];

let photoIndex = 0;
let msgIndex = 0;

let photoTimer;
let msgTimer;

function startStory(){

document.getElementById("intro").style.display="none";

document.getElementById("story").style.display="flex";

const music = document.getElementById("music");

music.play().catch(()=>{});

changePhoto();
changeMessage();

photoTimer = setInterval(changePhoto,5000);

msgTimer = setInterval(changeMessage,7000);

music.onended = function(){

clearInterval(photoTimer);
clearInterval(msgTimer);

document.getElementById("finalScreen").style.display="flex";

};

}

function changePhoto(){

document.getElementById("story").style.backgroundImage =
`url('${photos[photoIndex]}')`;

photoIndex++;

if(photoIndex >= photos.length){

photoIndex = 0;

}

}

function changeMessage(){

document.getElementById("message").innerHTML =
messages[msgIndex];

msgIndex++;

if(msgIndex >= messages.length){

msgIndex = messages.length - 1;

}

}

function createHeart(){

const heart = document.createElement("div");

heart.className = "heart";

heart.innerHTML = "❤️";

heart.style.left = Math.random()*100 + "vw";

heart.style.fontSize =
(20 + Math.random()*25) + "px";

heart.style.animationDuration =
(4 + Math.random()*4) + "s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},8000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
